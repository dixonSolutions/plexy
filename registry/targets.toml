# Plexy target registry.
#
# Every image-based OS Plexy knows how to migrate to, how the migrated system
# stays updated, and which conversions are available from which sources.
#
# This file is built into plexy. Add or override entries without rebuilding by
# dropping *.toml files with the same schema into
#     /etc/plexy/targets.d/            (system-wide)
#     ~/.config/plexy/targets.d/       (per user, $XDG_CONFIG_HOME respected)
# An entry with an existing `id` replaces the built-in one; a new `id` adds a
# target. `plexy targets --files` shows which files were loaded.
#
# Nothing here describes an image's *contents*: packages, desktop sessions,
# accounts and tooling are always read from the image itself. `desktop` is the
# expected desktop, used to pick candidates for `--target auto`; the image is
# still inspected and a mismatch is still refused.
#
# [target.update] — how the installed system receives updates:
#   remote    image reference the installed system follows (default: image)
#   signed    verify signatures with the image's own sigstore policy
#             (ostree-image-signed); requires the image to ship that policy
#   layering  how packages Plexy layers survive updates:
#     "client"  rpm-ostree layers them on top of the upstream image, so the
#               system follows `remote` directly (needs rpm-ostree in the image)
#     "image"   a derived image built locally FROM `remote`; `plexy update`
#               (and plexy-update.timer) rebuild it when `remote` changes
#     "abroot"  ABRoot replays /etc/abroot/packages.add at every upgrade
#
# [[target.conversion]] — which sources can be migrated to this target:
#   from      os-release IDs (fedora, ubuntu, ultramarine, ...) or
#             "family:fedora" / "family:debian"
#   source    "mutable" (plexy migrate), "image-based" (plexy switch), "any"
#   modes     package routing modes supported: image, hybrid, brew, toolbox
#   status    "verified"   ran end to end in the lab (see evidence)
#             "untested"   expected to work, not yet run
#             "unsupported" refused, with `notes` explaining why
#   evidence  verification log in the repository

[[target]]
id = "bluefin"
name = "Bluefin"
image = "ghcr.io/ublue-os/bluefin:stable"
backend = "bootc"
family = "fedora"
desktop = "gnome"
priority = 10
summary = "Universal Blue Bluefin (GNOME), Homebrew + distrobox preinstalled"
[target.update]
signed = true
layering = "client"
[[target.conversion]]
from = ["ultramarine"]
source = "mutable"
modes = ["hybrid", "toolbox"]
status = "verified"
evidence = "demos/ultramarine-bluefin.verify.txt, demos/ultramarine-bluefin-reboot.verify.txt, demos/ultramarine-bluefin-toolbox.verify.txt, demos/ultramarine-export.verify.txt"
notes = "verified in the full regression on d4e2e7c (demos/final-regression.txt)"
[[target.conversion]]
from = ["ubuntu"]
source = "mutable"
modes = ["hybrid"]
status = "verified"
evidence = "demos/ubuntu-bluefin.verify.txt"
notes = "verified in the full regression on d4e2e7c (demos/final-regression.txt)"
[[target.conversion]]
from = ["debian"]
source = "mutable"
modes = ["hybrid"]
status = "verified"
evidence = "demos/debian-bluefin.verify.txt, demos/debian-cleanup.verify.txt, demos/debian-dryrun.check.txt"
notes = "verified in the full regression on d4e2e7c (demos/final-regression.txt)"
[[target.conversion]]
from = ["fedora", "silverblue", "kinoite", "bluefin", "aurora", "bazzite"]
source = "image-based"
modes = ["image"]
status = "verified"
evidence = "demos/silverblue-bluefin.verify.txt, demos/silverblue-bluefin-reboot.verify.txt"
notes = "verified in the full regression on d4e2e7c (demos/final-regression.txt)"
[[target.conversion]]
from = ["family:fedora", "family:debian"]
source = "any"
modes = ["image", "hybrid", "brew", "toolbox"]
status = "untested"

