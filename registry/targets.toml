backend = "bootc"
family = "fedora"
desktop = "headless"
priority = 10
summary = "Fedora bootc base (headless servers)"
[target.update]
signed = false
# Server images are usually built, not layered: keep a derived image and let
# `plexy update` rebuild it from the remote.
layering = "image"
[[target.conversion]]
from = ["fedora"]
source = "mutable"
modes = ["image"]
status = "verified"
evidence = "demos/fedora-bootc.verify.txt, demos/fedora-bootc-update.verify.txt"
notes = "verified in the full regression on d4e2e7c, incl. plexy update rebuilding and staging a changed image"
[[target.conversion]]
from = ["family:fedora", "family:debian"]
source = "any"
modes = ["image", "hybrid", "brew", "toolbox"]
status = "untested"

[[target]]
id = "vanilla"
name = "Vanilla OS"
image = "ghcr.io/vanilla-os/gnome:latest"
backend = "abroot"
family = "debian"
desktop = "gnome"
priority = 30
summary = "Vanilla OS (GNOME, Debian-based) on ABRoot A/B partitions"
[target.update]
signed = false
layering = "abroot"
[[target.conversion]]
from = ["ubuntu"]
source = "mutable"
modes = ["image"]
status = "verified"
evidence = "demos/ubuntu-vanilla.verify.txt"
notes = "verified in the full regression on d4e2e7c; needs --abroot-disk (a second disk or free space); the old system stays bootable"
[[target.conversion]]
from = ["family:debian"]
source = "mutable"
modes = ["image", "hybrid", "brew", "toolbox"]
status = "untested"
notes = "needs --abroot-disk (a second disk or free space)"
[[target.conversion]]
from = ["family:fedora"]
source = "mutable"
modes = ["hybrid", "toolbox"]
status = "untested"
notes = "Fedora packages have no Debian equivalents in general: route software to a toolbox of the old system"
[[target.conversion]]
from = ["family:fedora", "family:debian"]
source = "image-based"
modes = []
status = "unsupported"
notes = "ABRoot cannot take over an ostree system in place; install Vanilla OS with its installer"
